# LiteLLM proxy, profile "prod-langfuse" (S6, D28): the prod profile plus the Langfuse
# callback. Every request is sent to the Langfuse stack (Web/worker/ClickHouse) as a trace.
model_list:
  - model_name: mock-gpt
    litellm_params:
      model: openai/mock-upstream
      api_base: http://mock-llm:9000/v1
      api_key: sk-mock-upstream # the mock accepts any key; local dummy value
    # Per-token prices so a request has a non-zero cost (the mock is not in
    # LiteLLM's price list). Same in both profiles, so both do the same cost math.
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Spend logs are written to Postgres (the default; stated so it is visible).
  disable_spend_logs: false
  # Seconds between batched spend writes to the database (LiteLLM default is 60).
  proxy_batch_write_at: 10

litellm_settings:
  # S6: the Langfuse callback (keys and host are environment variables in
  # docker-compose.prod-langfuse.yml). Prompts and responses are logged (LiteLLM's default).
  callbacks: []
  success_callback: ["langfuse"]
  failure_callback: []
  # No response cache: every request must reach the mock. (Redis is used for
  # LiteLLM's shared spend and rate-limit counters, not for caching answers.)
  cache: false
  num_retries: 0

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
