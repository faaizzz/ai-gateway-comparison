name: gwbench
services:
  k6:
    profiles:
      - tools
    build:
      context: ./k6
      dockerfile: Dockerfile
    environment:
      K6_NO_USAGE_REPORT: "true"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 2s
      K6_PROMETHEUS_RW_SERVER_URL: http://gwbench-prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),avg,max
    image: gwbench/k6:2.3.0-sse0.2.0
    networks:
      gwbench: null
    user: "501:20"
    volumes:
      - type: bind
        source: ./k6
        target: /k6
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ./results
        target: /results
        bind:
          create_host_path: true
    working_dir: /k6
  mock-llm:
    build:
      context: ./mock-llm
      dockerfile: Dockerfile
    cpus: 2
    container_name: gwbench-mock-llm
    environment:
      MOCK_429_RATE: ""
      MOCK_FAIL_RATE: ""
      MOCK_FAIL_STATUS: ""
      MOCK_ITL_MS: "5"
      MOCK_LATENCY_MS: "60"
      MOCK_OUTPUT_TOKENS: "1700"
      MOCK_RETRY_AFTER_S: ""
      MOCK_TTFT_MS: "20"
      MOCK_WORKER_THREADS: "8"
    hostname: mock-llm
    healthcheck:
      test:
        - CMD
        - mock-upstream
        - --healthcheck
      timeout: 3s
      interval: 2s
      retries: 15
      start_period: 1s
    image: gwbench/mock-llm:0.1.0
    mem_limit: "536870912"
    memswap_limit: "536870912"
    networks:
      gwbench: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9000
        published: "19000"
        protocol: tcp
    restart: "no"
  sampler:
    profiles:
      - tools
    entrypoint:
      - python3
      - -B
      - /scripts/sampler.py
    environment:
      PYTHONUNBUFFERED: "1"
    image: python:3.13.9-alpine3.22
    networks:
      gwbench: null
    volumes:
      - type: bind
        source: ./scripts/sampler.py
        target: /scripts/sampler.py
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ./results
        target: /results
        bind:
          create_host_path: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: true
networks:
  gwbench:
    name: gwbench
