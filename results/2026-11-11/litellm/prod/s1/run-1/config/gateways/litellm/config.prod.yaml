# LiteLLM proxy, profile "prod" (contract rule 4): Postgres, Redis, a virtual key
# with a budget, spend tracking on. See decisions D11.
model_list:
  - model_name: mock-gpt
    litellm_params:
      model: openai/mock-upstream
      api_base: http://mock-llm:9000/v1
      api_key: sk-mock-upstream # the mock accepts any key; local dummy value
    # Per-token prices so a request has a non-zero cost (the mock is not in
    # LiteLLM's price list). Same in both profiles, so both do the same cost math.
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Spend logs are written to Postgres (the default; stated so it is visible).
  disable_spend_logs: false
  # Seconds between batched spend writes to the database (LiteLLM default is 60).
  proxy_batch_write_at: 10

litellm_settings:
  # Hook for S6: the Langfuse callback is added later. Leave this list as is and
  # add `langfuse` here (with its keys in the compose overlay) in that story.
  callbacks: []
  success_callback: []
  failure_callback: []
  # Redis backs the shared caches (rate-limit counters, spend) across workers.
  cache: false
  num_retries: 0

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
