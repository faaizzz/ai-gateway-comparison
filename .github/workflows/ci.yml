name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # docker compose config on every compose file, shellcheck on scripts/*.sh,
      # ruff on Python. Linters run in containers. Same script as `make lint`.
      - run: ./scripts/ci-checks.sh

  # Builds the mock and the custom k6 image and runs the base stack end to end:
  # mock healthy, k6 plain + SSE request, sampler CSV.
  base-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make k6-build
      - run: make base-smoke
      # The runner end to end on the direct target: stack up, smoke, k6, metadata, summary.
      - run: make run TARGET=direct SCENARIO=s1 RATE=100 DURATION=5 WARMUP=2
      - if: always()
        run: make base-down
